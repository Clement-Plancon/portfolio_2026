<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototype A — Planches</title>
<script src="data.js"></script>
<style>
@font-face { font-family: 'Schibsted'; src: url(fonts/schibsted.woff2) format('woff2'); font-weight: 400 900; font-display: swap; }
@font-face { font-family: 'Plex Mono'; src: url(fonts/plex-mono.woff2) format('woff2'); font-weight: 400; font-display: swap; }
:root {
  --paper: #efede7; --paper-2: #e6e3db; --ink: #121211; --ink-2: #5d5b55; --rule: #12121126; --accent: #d8401f;
  --gut: clamp(16px, 3.2vw, 48px); --col: calc((100vw - 2 * var(--gut)) / 12);
  --sans: 'Schibsted', ui-sans-serif, system-ui, sans-serif; --mono: 'Plex Mono', ui-monospace, monospace;
  --ease: cubic-bezier(.2,.7,.1,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper); color: var(--ink); font: 400 17px/1.5 var(--sans); -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
body { overflow-x: clip; }
a { color: inherit; }
.mono { font: 400 .72rem/1.4 var(--mono); letter-spacing: .02em; text-transform: uppercase; }
.wrap { padding-inline: var(--gut); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: clamp(12px, 1.6vw, 24px); }

/* Header */
.hd { position: fixed; inset: 0 0 auto 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; height: 56px; padding-inline: var(--gut); background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--rule); }
.hd b { font-weight: 650; letter-spacing: -.01em; }
.hd nav { display: flex; gap: 28px; }
.hd nav a { text-decoration: none; font-size: .9rem; position: relative; }
.hd nav a[aria-current]::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 1.5px; background: currentColor; }
.hd .cta { font-size: .9rem; text-decoration: none; border: 1px solid var(--ink); border-radius: 99px; padding: 6px 14px; }
.hd .cta:hover { background: var(--ink); color: var(--paper); }

/* Hero */
.hero { padding-top: calc(56px + clamp(32px, 7vh, 96px)); }
.hero__meta { grid-column: 1 / -1; display: flex; justify-content: space-between; border-top: 1px solid var(--ink); padding-top: 10px; }
.hero h1 { grid-column: 1 / -1; font-weight: 700; font-size: clamp(3.2rem, 11.6vw, 13rem); line-height: .86; letter-spacing: -.055em; margin-top: clamp(24px, 4vh, 48px); }
.hero h1 span { display: block; }
.hero h1 .r { padding-left: calc(var(--col) * 3); }
.hero__role { grid-column: 1 / span 5; margin-top: clamp(28px, 5vh, 56px); font-size: clamp(1.25rem, 1.9vw, 1.75rem); line-height: 1.2; letter-spacing: -.02em; }
.hero__lead { grid-column: 7 / span 5; margin-top: clamp(28px, 5vh, 56px); color: var(--ink-2); max-width: 34em; }
.hero__lead em { font-style: normal; color: var(--ink); box-shadow: inset 0 -.35em 0 color-mix(in srgb, var(--accent) 22%, transparent); }

/* Index */
.index { margin-top: clamp(56px, 10vh, 120px); }
.index__h { grid-column: 1 / -1; display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.index ol { grid-column: 1 / -1; list-style: none; }
.index li a { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--rule); text-decoration: none; transition: padding .5s var(--ease), color .3s; }
.index li { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; }
.index .n { grid-column: 1; }
.index .t { grid-column: 2 / span 5; font-size: clamp(1.3rem, 2.2vw, 2rem); font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.index .k { grid-column: 7 / span 4; color: var(--ink-2); font-size: .9rem; }
.index .y { grid-column: 11 / span 2; text-align: right; }
@media (hover: hover) { .index ol:hover a { color: color-mix(in srgb, var(--ink) 40%, transparent); } .index ol a:hover { color: var(--ink); padding-left: 12px; } }

/* Plates */
.sec-h { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--ink); margin-top: clamp(96px, 16vh, 200px); }
.sec-h h2 { font-size: clamp(2rem, 4.5vw, 4rem); letter-spacing: -.045em; line-height: 1; font-weight: 650; }
.plate { padding-block: clamp(48px, 10vh, 120px); border-bottom: 1px solid var(--rule); scroll-margin-top: 56px; }
.plate__txt { grid-column: 1 / span 5; align-self: start; position: sticky; top: 88px; }
.plate__no { display: flex; gap: 16px; color: var(--ink-2); }
.plate h3 { font-size: clamp(2.1rem, 4.2vw, 3.9rem); line-height: .95; letter-spacing: -.045em; font-weight: 650; margin: 18px 0 20px; text-wrap: balance; }
.plate__sum { font-size: 1.06rem; line-height: 1.45; max-width: 30em; }
.spec { margin-top: 28px; border-top: 1px solid var(--rule); }
.spec div { display: grid; grid-template-columns: 9em 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: .92rem; }
.spec dt { font: .7rem/1.9 var(--mono); text-transform: uppercase; color: var(--ink-2); }
.plate details { margin-top: 24px; }
.plate summary { list-style: none; cursor: pointer; display: inline-flex; gap: 10px; align-items: center; font-weight: 600; padding: 10px 0; }
.plate summary::-webkit-details-marker { display: none; }
.plate summary i { width: 22px; height: 22px; border: 1px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-style: normal; transition: transform .4s var(--ease); }
.plate details[open] summary i { transform: rotate(45deg); }
.plate details ul { margin: 8px 0 0 0; list-style: none; counter-reset: c; }
.plate details li { counter-increment: c; display: grid; grid-template-columns: 2.2em 1fr; padding: 8px 0; border-top: 1px solid var(--rule); font-size: .95rem; }
.plate details li::before { content: counter(c, decimal-leading-zero); font: .72rem/1.9 var(--mono); color: var(--accent); }
.plate details p { color: var(--ink-2); margin-top: 10px; font-size: .95rem; max-width: 34em; }
.plate__fig { grid-column: 7 / span 6; margin: 0; }
.plate__fig figcaption { margin-top: 14px; display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 8px; }

/* Exploded stack figure */
.stage { position: relative; aspect-ratio: 1 / .92; background: var(--paper-2); overflow: hidden; }
.iso { position: absolute; left: 50%; top: 52%; width: 62%; aspect-ratio: 16 / 11; transform-style: preserve-3d; transform: translate(-50%, -50%) rotateX(58deg) rotateZ(-38deg); }
.slab { position: absolute; inset: 0; border: 1px solid var(--ink); background: var(--paper); transform: translateZ(calc(var(--i) * var(--gap, 14px))); transition: transform 1.1s var(--ease); display: flex; flex-direction: column; justify-content: flex-end; padding: 5%; box-shadow: 0 0 0 0 transparent; }
.slab--top { background: var(--ink); color: var(--paper); justify-content: space-between; }
.slab--top b { font-size: clamp(1rem, 2.4vw, 2.2rem); letter-spacing: -.04em; line-height: .95; font-weight: 650; }
.slab--img { padding: 0; background: #fff; overflow: hidden; }
.slab--img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.slab .lbl { font: 500 clamp(.5rem, .8vw, .72rem)/1.3 var(--mono); text-transform: uppercase; letter-spacing: .03em; }
.slab .lbl em { font-style: normal; color: var(--accent); margin-right: .6em; }
.slab .tags { font-size: clamp(.7rem, 1.25vw, 1.05rem); font-weight: 550; letter-spacing: -.01em; margin-top: 4px; }
.stage.open .slab { --gap: clamp(38px, 5.4vw, 78px); }
.stage__note { position: absolute; left: 16px; bottom: 12px; }

/* Profile */
.about p.big { grid-column: 1 / span 9; font-size: clamp(1.6rem, 3.4vw, 3.1rem); line-height: 1.08; letter-spacing: -.035em; font-weight: 500; margin-top: 40px; text-wrap: pretty; }
.about p.big em { font-style: normal; color: var(--ink-2); }
.about .bio { grid-column: 7 / span 5; margin-top: 48px; color: var(--ink-2); }
.about .bio p + p { margin-top: 1em; }
.princ { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(12px, 1.6vw, 24px); margin-top: 72px; }
.princ div { border-top: 1px solid var(--ink); padding-top: 12px; }
.princ h4 { font-weight: 600; font-size: 1.05rem; letter-spacing: -.01em; margin: 10px 0 8px; }
.princ p { color: var(--ink-2); font-size: .92rem; }

.xp { grid-column: 1 / -1; margin-top: 32px; }
.xp > div { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; padding: 22px 0; border-bottom: 1px solid var(--rule); }
.xp .d { grid-column: 1 / span 2; }
.xp .r { grid-column: 3 / span 5; }
.xp .r b { font-size: 1.3rem; font-weight: 600; letter-spacing: -.02em; display: block; line-height: 1.15; }
.xp .r span { color: var(--ink-2); }
.xp .s { grid-column: 8 / span 5; color: var(--ink-2); font-size: .95rem; }
.skills { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 clamp(12px, 1.6vw, 24px); margin-top: 32px; }
.skills div { border-top: 1px solid var(--rule); padding: 16px 0 28px; }
.skills h4 { font-weight: 600; }
.skills p { color: var(--ink-2); font-size: .92rem; }

.contact { background: var(--ink); color: var(--paper); margin-top: clamp(96px, 16vh, 200px); padding-block: clamp(64px, 12vh, 140px) 32px; }
.contact .mono { color: #a7a49c; }
.contact a.mail { grid-column: 1 / -1; font-size: clamp(2rem, 7.4vw, 8.4rem); letter-spacing: -.055em; line-height: .95; font-weight: 650; text-decoration: none; margin-top: 24px; overflow-wrap: anywhere; }
.contact a.mail:hover { color: var(--accent); }
.contact .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px 32px; margin-top: 56px; border-top: 1px solid #ffffff33; padding-top: 16px; }

/* Reveal */
.js .rv { opacity: 0; transform: translateY(24px); transition: opacity .9s var(--ease), transform .9s var(--ease); }
.js .rv.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .js .rv { opacity: 1; transform: none; } .slab { transition: none; } html { scroll-behavior: auto; } }

/* Mobile bar */
.tab { display: none; }
@media (max-width: 1023px) {
  .plate__txt, .plate__fig { grid-column: 1 / -1; position: static; }
  .plate__fig { order: -1; margin-bottom: 32px; }
  .hero__role, .hero__lead { grid-column: 1 / -1; }
  .hero__lead { margin-top: 16px; }
  .about p.big { grid-column: 1 / -1; } .about .bio { grid-column: 1 / -1; }
  .princ { grid-template-columns: 1fr 1fr; }
  .xp .d { grid-column: 1 / -1; } .xp .r { grid-column: 1 / span 6; } .xp .s { grid-column: 7 / -1; }
  .skills { grid-template-columns: 1fr 1fr; }
  .stage { aspect-ratio: 4 / 3; }
}
@media (max-width: 720px) {
  .hd nav, .hd .cta { display: none; }
  .hero h1 .r { padding-left: 0; }
  .index .t { grid-column: 2 / -1; } .index .k { display: none; } .index .y { grid-column: 2 / -1; text-align: left; }
  .index .n { grid-column: 1; }
  .princ, .skills { grid-template-columns: 1fr; }
  .xp .r, .xp .s { grid-column: 1 / -1; } .xp .s { margin-top: 8px; }
  .spec div { grid-template-columns: 7em 1fr; }
  .stage { aspect-ratio: 1 / 1; } .iso { width: 74%; }
  .tab { display: flex; position: fixed; z-index: 30; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); background: var(--ink); color: var(--paper); border-radius: 16px; padding: 6px; justify-content: space-between; }
  .tab a { flex: 1; text-align: center; text-decoration: none; padding: 12px 4px; font-size: .9rem; border-radius: 11px; }
  .tab a[aria-current] { background: #ffffff1f; }
  .contact { padding-bottom: 96px; }
}
</style>
</head>
<body>
<header class="hd"><b>Clément Plançon</b><nav aria-label="Sommaire"></nav><a class="cta" href="#contact">Me contacter</a></header>
<main id="m"></main>
<nav class="tab" aria-label="Navigation rapide"><a href="#projets">Projets</a><a href="#profil">Profil</a><a href="#parcours">Parcours</a><a href="#contact">Contact</a></nav>
<script>
document.documentElement.classList.add('js');
const D = window.DATA, P = D.profile;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const yr = (p) => p?.period ? (p.period.end ? `${p.period.start}–${p.period.end}` : p.period.start) : p.status === 'en-cours' ? 'En cours' : '—';
const LAYERS = [
  ['Interface', ['React', 'Next.js', 'Flutter', 'Dart', 'JavaScript', 'Chart.js', 'Application mobile', 'Dataviz']],
  ['Serveur', ['Node.js', 'PHP', 'Python', 'Scrapy']],
  ['Données', ['PostgreSQL', 'MongoDB', 'Firebase', 'Open data']],
  ['Services', ['Google Vision AI', 'OpenAI', 'Géolocalisation', 'Vie privée']],
  ['Infra', ['Docker']],
  ['Méthode', ['UX research', 'Cadrage technique', 'Prototypage', 'Co-conception']],
];
const layersOf = (techs) => {
  const out = LAYERS.map(([n, list]) => [n, techs.filter((t) => list.includes(t))]).filter(([, l]) => l.length);
  const rest = techs.filter((t) => !LAYERS.some(([, l]) => l.includes(t)));
  if (rest.length) out.push(['Autres', rest]);
  return out;
};
const IMG = { datametre: 'media/datametre-desktop.webp' };
const sections = [['projets', 'Projets'], ['profil', 'Profil'], ['parcours', 'Parcours'], ['competences', 'Compétences'], ['contact', 'Contact']];
document.querySelector('.hd nav').innerHTML = sections.map(([id, t]) => `<a href="#${id}">${t}</a>`).join('');
const pj = D.projects;
const stmt = P.statement.replace(/\*(.+?)\*/, '<em>$1</em>');
document.getElementById('m').innerHTML = `
<section class="hero wrap"><div class="grid">
  <div class="hero__meta mono"><span>Portfolio — ${new Date().getFullYear()}</span><span>${esc(P.location)}</span></div>
  <h1><span>Clément</span><span class="r">Plançon</span></h1>
  <p class="hero__role">${esc(P.jobTitle)}.<br>${esc(P.headline)}</p>
  <p class="hero__lead">${stmt} ${esc(P.intro)}</p>
</div>
<div class="index grid" aria-label="Index des projets">
  <div class="index__h mono"><span>Index — ${pj.length} projets</span><span>Année</span></div>
  <ol>${pj.map((p, i) => `<li><a href="#projet-${p.id}"><span class="n mono">${String(i + 1).padStart(2, '0')}</span><span class="t">${esc(p.title)}</span><span class="k">${esc(p.kind)}</span><span class="y mono">${yr(p)}</span></a></li>`).join('')}</ol>
</div></section>

<section id="projets" class="wrap"><div class="grid"><div class="sec-h"><h2>Projets</h2><span class="mono">01 — ${String(pj.length).padStart(2, '0')}</span></div></div>
${pj.map((p, i) => {
  const L = layersOf(p.technologies);
  const n = L.length + 1;
  return `<article class="plate grid" id="projet-${p.id}">
  <div class="plate__txt rv">
    <div class="plate__no mono"><span>${String(i + 1).padStart(2, '0')}</span><span>${p.category === 'pro' ? 'Professionnel' : 'Personnel'}</span></div>
    <h3>${esc(p.title)}</h3>
    <p class="plate__sum">${esc(p.summary)}</p>
    <dl class="spec">
      <div><dt>Cadre</dt><dd>${esc(p.organisation)}</dd></div>
      <div><dt>Nature</dt><dd>${esc(p.kind)}</dd></div>
      <div><dt>Période</dt><dd>${yr(p)}</dd></div>
      <div><dt>Pile</dt><dd>${p.technologies.map(esc).join(', ')}</dd></div>
    </dl>
    <details><summary><i>+</i> ${p.category === 'pro' ? 'Contributions' : 'Fonctionnalités'} (${p.contributions.length})</summary>
      ${p.context ? `<p>${esc(p.context.split('\n\n')[0])}</p>` : ''}
      <ul>${p.contributions.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>
      ${p.links.map((l) => `<p><a href="${esc(l.url)}">${esc(l.label)} ↗</a></p>`).join('')}
    </details>
  </div>
  <figure class="plate__fig rv">
    <div class="stage" data-stage>
      <div class="iso" aria-hidden="true">
        ${L.slice().reverse().map(([name, t], j) => `<div class="slab" style="--i:${j}"><span class="lbl"><em>${String(L.length - j).padStart(2, '0')}</em>${name}</span><span class="tags">${t.map(esc).join(' · ')}</span></div>`).join('')}
        ${IMG[p.id] ? `<div class="slab slab--img" style="--i:${n - 1}"><img src="${IMG[p.id]}" alt=""></div>` : `<div class="slab slab--top" style="--i:${n - 1}"><span class="lbl">${esc(p.kind)}</span><b>${esc(p.title)}</b></div>`}
      </div>
      <span class="stage__note mono">${IMG[p.id] ? 'Capture réelle + pile technique' : 'Pile technique, par couches'}</span>
    </div>
    <figcaption class="mono"><span>Fig. ${i + 1} — ${esc(p.title)}</span><span>${p.technologies.length} technologies</span></figcaption>
  </figure>
</article>`;
}).join('')}
</section>

<section id="profil" class="about wrap"><div class="grid">
  <div class="sec-h"><h2>Profil</h2><span class="mono">${esc(P.location)}</span></div>
  <p class="big rv">${esc(P.intro)} <em>${esc(P.bio.split('\n\n').at(-1))}</em></p>
  <div class="bio rv">${P.bio.split('\n\n').slice(0, 3).map((t) => `<p>${esc(t)}</p>`).join('')}</div>
  <div class="princ">${P.principles.map((x, i) => `<div class="rv"><span class="mono">${String(i + 1).padStart(2, '0')}</span><h4>${esc(x.title)}</h4><p>${esc(x.text)}</p></div>`).join('')}</div>
</div></section>

<section id="parcours" class="wrap"><div class="grid">
  <div class="sec-h"><h2>Parcours</h2><span class="mono">${D.experiences.length} postes</span></div>
  <div class="xp">${D.experiences.map((e) => `<div class="rv"><span class="d mono">${e.start} — ${e.end ?? 'aujourd’hui'}</span><p class="r"><b>${esc(e.role)}</b><span>${esc(e.organisation)}${e.parentOrganisation ? ' · ' + esc(e.parentOrganisation) : ''}</span></p><p class="s">${esc(e.summary)}</p></div>`).join('')}</div>
</div></section>

<section id="competences" class="wrap"><div class="grid">
  <div class="sec-h"><h2>Compétences</h2><span class="mono">${D.skills.groups.length} domaines</span></div>
  <div class="skills">${D.skills.groups.map((g) => `<div class="rv"><h4>${esc(g.name)}</h4><p>${g.items.map(esc).join(', ')}</p></div>`).join('')}</div>
</div></section>

<section id="contact" class="contact wrap"><div class="grid">
  <span class="mono" style="grid-column:1/-1">Contact — une idée, un projet, une question</span>
  <a class="mail" href="mailto:${P.email}">${P.email.replace('@', '<wbr>@')}</a>
  <div class="row mono">${P.socials.map((s) => `<a href="${esc(s.url)}">${esc(s.label)} ↗</a>`).join('')}<span>${esc(P.location)}</span></div>
</div></section>`;

const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -10% 0px' });
document.querySelectorAll('.rv').forEach((el) => io.observe(el));
const so = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle('open', e.isIntersecting)), { rootMargin: '-30% 0px -30% 0px' });
document.querySelectorAll('[data-stage]').forEach((el) => so.observe(el));
const links = [...document.querySelectorAll('.hd nav a, .tab a')];
const no = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) links.forEach((a) => a.toggleAttribute('aria-current', a.hash === '#' + e.target.id)); }), { rootMargin: '-45% 0px -50% 0px' });
sections.forEach(([id]) => no.observe(document.getElementById(id)));
</script>
</body>
</html>
